<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Not found — Web-Prep</title>
<meta name="theme-color" content="#0f766e">
<!--
  This page is deliberately self-contained: styles inline, no external assets.

  GitHub Pages serves this file for any missing path at any depth, so a
  relative href like ./assets/css/base.css would resolve against the missing
  URL's folder rather than the site root and fail. Inlining sidesteps that
  entirely, and the home link below is computed at runtime rather than
  hardcoded, so it is correct locally and on Pages.
-->
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --surface: #f6f7f9; --text: #17202a;
    --muted: #5b6672; --border: #dfe3e8; --brand: #0f766e; --on-brand: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10151b; --surface: #171e26; --text: #e8edf2;
      --muted: #9aa7b4; --border: #26303b; --brand: #2dd4bf; --on-brand: #06231f;
    }
  }
  *, *::before, *::after { box-sizing: border-box; }
  * { margin: 0; }
  body {
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 1.5rem;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  main { width: min(100%, 34rem); text-align: center; }
  .code {
    font-size: 0.78rem; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--brand);
  }
  h1 { font-size: clamp(1.75rem, 1.3rem + 2vw, 2.5rem); line-height: 1.2; margin-block: 0.5rem; }
  p { color: var(--muted); max-width: 46ch; margin-inline: auto; }
  .path {
    display: inline-block; margin-top: 1rem; padding: 0.4rem 0.7rem;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 0.82rem; word-break: break-all;
  }
  .btn {
    display: inline-block; margin-top: 1.5rem; padding: 0.6rem 1.1rem;
    background: var(--brand); color: var(--on-brand);
    border-radius: 6px; text-decoration: none; font-weight: 600;
  }
  .btn:hover { filter: brightness(1.08); }
  :focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
</style>
</head>
<body>

<main>
  <p class="code">404</p>
  <h1>That page does not exist</h1>
  <p>
    Either it has not been built yet — most of this site arrives phase by phase — or the
    address is wrong.
  </p>
  <p class="path" id="path">…</p>
  <p><a class="btn" id="home" href="./">Go to the home page</a></p>
</main>

<script>
  (function () {
    document.getElementById('path').textContent = location.pathname;

    /* On a GitHub Pages project site the repository name is the first path
       segment and is the site root. Anywhere else, the server root is. */
    var home = '/';
    if (/\.github\.io$/i.test(location.hostname)) {
      var first = location.pathname.split('/').filter(Boolean)[0];
      if (first) home = '/' + first + '/';
    }
    document.getElementById('home').href = home;
  }());
</script>

</body>
</html>
